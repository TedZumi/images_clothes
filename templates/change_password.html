{% extends 'base.html' %}

{% block title %}Смена пароля{% endblock %}

{% block body %}
<div class="auth-container">
    <form method="post" class="reg">
        <fieldset class="reg_en">
            <legend align="center">Смена пароля</legend>
            
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            
            {% if success %}
            <div class="success-message">{{ success }}</div>
            <p><a href="{{ url_for('profile') }}">Вернуться в профиль →</a></p>
            {% endif %}
            
            {% if not success %}
            <div class="form-group">
                <label for="new_password">Новый пароль:</label>
                <input type="password" id="new_password" name="new_password" required minlength="8">
                <small>Минимум 8 символов</small>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Подтвердите пароль:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            
            <button type="submit" class="button">Сохранить</button>
            <a href="{{ url_for('profile') }}" class="button cancel">Отмена</a>
            {% endif %}
        </fieldset>
    </form>
</div>
{% endblock %}

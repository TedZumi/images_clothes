{% extends 'base.html' %}

{% block title %}
Профиль
{% endblock %}

{% block body %}
<h1 class="heading">Личный кабинет</h1>
{% if request.args.get('success') %}
	<div class="success-message">{{ request.args.get('success') }}</div>
{% endif %}
<div class="persona">
	<div class="prof_grid1">
		<div id="user-info">
			<script>
				fetch(`/api/v1/users/{{ person_id }}`)
					.then(response => response.json())
					.then(data => {
						document.getElementById('user-info').innerHTML = `
							<p class="persona_fieldset">Личная информация</p>
							<p class="persona_fieldset" >ФИО: ${data.username}</p>
							<p class="persona_fieldset">E-mail: ${data.email}</p>
						`;
					})
					.catch(error => console.error('Error fetching user data:', error));
			</script>
		</div>

		<div class="buttons-container">
			<form action="{{ url_for('initiate_change', target='password') }}" method="get" class="persona_form">
				<button type="submit" class="save_button persona_button">Изменить пароль</button>
			</form>
	
			<form action="{{ url_for('initiate_change', target='images') }}" method="get" class="persona_form">
				<button type="submit" class="save_button persona_button">Выбор новой последовательности</button>
			</form>
		</div>
	</div>
	
	<div class="persona_grid right_grid">
		<nav>
			<ul class="persona_ul">
				<li class="persona_li"><a class="persona_a" href="/profile">Личный кабинет</a></li>
				<li class="persona_li"><a class="persona_a" href="/wardrobe">Мой гардероб</a></li>
				<li class="persona_li"><a class="persona_a" href="/images">Мои образы</a></li>
				<form method="POST" action="{{ logout_url }}">
					<button class="button persona_button2 btn btn-danger" type="submit" id="buttn">Выйти</button>
				</form>
			</ul>
		</nav>
	</div>
</div>
{% endblock %}
